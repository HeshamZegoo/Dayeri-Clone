name: Validate game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and syntax-check game module
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          assert match, "Game module not found"
          Path("/tmp/game.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/game.mjs
      - name: Validate web app manifest
        run: python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Check required app files
        run: test -s index.html && test -s sw.js && test -s icon.svg
